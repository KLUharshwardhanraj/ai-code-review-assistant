# ==============================================================================
# AI Code Review Assistant — Development Profile
# ==============================================================================
# Activate with: --spring.profiles.active=dev
# Overrides production defaults for local development convenience.
# ==============================================================================

spring:
  # ─── JPA / Hibernate ───
  jpa:
    hibernate:
      ddl-auto: update    # Auto-create/update schema from entities (dev only)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ─── Logging (verbose SQL for debugging) ───
logging:
  level:
    com.aicodereviewer: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
